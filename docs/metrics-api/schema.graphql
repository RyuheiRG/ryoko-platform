type AdMetrics {
  impressions: Int!
  clicks: Int!
  ctr: Float!
}

"""Date (isoformat)"""
scalar Date

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

"""Date with time (isoformat)"""
scalar DateTime

enum EventType {
  PAGE_VIEW
  POST_VIEW
  PROJECT_VIEW
  OUTBOUND_CLICK
  AD_IMPRESSION
  AD_CLICK
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type Mutation {
  trackEvent(input: TrackEventInput!): TrackEventPayload!
  trackEvents(input: [TrackEventInput!]!): TrackEventsPayload!
}

type OutboundClick {
  url: String!
  clicks: Int!
}

type ProjectClicks {
  slug: String!
  clicks: Int!
}

type ProjectViews {
  slug: String!
  views: Int!
}

type Query {
  pageViews(range: DateRangeInput!, path: String = null): TimeSeries!
  topPosts(range: DateRangeInput!, limit: Int! = 10): [TopPost!]!
  projectViews(range: DateRangeInput!): [ProjectViews!]!
  projectClicks(range: DateRangeInput!): [ProjectClicks!]!
  outboundClicks(range: DateRangeInput!, limit: Int! = 20): [OutboundClick!]!
  adMetrics(range: DateRangeInput!, ad_id: String = null): AdMetrics!
  realtime(window_minutes: Int! = 5): Int!
}

type TimeSeries {
  total: Int!
  points: [TimeSeriesPoint!]!
}

type TimeSeriesPoint {
  date: Date!
  value: Int!
}

type TopPost {
  slug: String!
  title: String
  views: Int!
}

input TrackEventInput {
  event_id: UUID!
  type: EventType!
  path: String!
  session_id: String!
  occurred_at: DateTime!
  post_slug: String = null
  project_slug: String = null
  ad_id: String = null
  referrer: String = null
  properties: JSON = null
}

type TrackEventPayload {
  ok: Boolean!
  event_id: UUID!
  duplicate: Boolean!
}

type TrackEventsPayload {
  accepted: Int!
  duplicates: Int!
}

scalar UUID
