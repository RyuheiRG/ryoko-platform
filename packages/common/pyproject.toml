[project]
name = "ryoko-common"
version = "0.1.0"
description = "Shared settings, auth, errors, logging and pagination for Ryoko services."
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "redis>=5.2",
  "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryoko_common"]
