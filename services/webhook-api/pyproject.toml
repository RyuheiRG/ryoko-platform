[project]
name = "ryoko-webhook-api"
version = "0.1.0"
description = "HMAC-verified webhook inbox and delivery service for Ryoko."
requires-python = ">=3.12,<3.13"
dependencies = [
  "ryoko-common",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
